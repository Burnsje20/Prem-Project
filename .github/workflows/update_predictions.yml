name: Update Predictions & Dashboard

on:
  schedule:
    # Matchdays: every 30 minutes from 11:00 to 22:00 UTC on Friday, Saturday, Sunday, Monday
    - cron: '*/30 11-22 * * 5,6,0,1'
    # Midweek: every 6 hours on Tuesday, Wednesday, Thursday
    - cron: '0 */6 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated update pipeline
        run: |
          python update_pipeline.py

      - name: Verify test suite integrity
        run: |
          python -m unittest discover -v

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add upcoming_premier_league_fixtures.csv fotmob_player_appearances.csv archives/ reports/ docs/
          if git diff-index --quiet HEAD; then
            echo "No updates detected; working tree is clean."
          else
            echo "Committing and pushing automated pipeline updates..."
            git commit -m "chore(auto): update fixtures, appearances, lineups, and dashboard [skip ci]"
            git push
          fi
